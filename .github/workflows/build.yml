name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore main project
        run: dotnet restore VideoMetadataEditor/VideoMetadataEditor.csproj

      - name: Restore test project
        run: dotnet restore VideoMetadataEditor.Tests/VideoMetadataEditor.Tests.csproj

      - name: Build app (Release)
        run: dotnet build VideoMetadataEditor/VideoMetadataEditor.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test VideoMetadataEditor.Tests/VideoMetadataEditor.Tests.csproj --configuration Release
